# sftp-s3 in front of a local S3-compatible store (RustFS), for trying it out.
# See README.md in this directory.
services:
  s3:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: demo-access-key
      RUSTFS_SECRET_KEY: demo-secret-key
    ports:
      - "127.0.0.1:9001:9001" # web console: http://localhost:9001
    volumes:
      - s3-data:/data

  create-bucket:
    image: curlimages/curl:8.17.0
    depends_on: [s3]
    restart: "no"
    # PUT /uploads, signed with SigV4; retries until the store is up.
    entrypoint:
      - sh
      - -c
      - |
        for i in $$(seq 30); do
          code=$$(curl -s -o /dev/null -w '%{http_code}' --aws-sigv4 aws:amz:us-east-1:s3 \
            --user demo-access-key:demo-secret-key -X PUT http://s3:9000/uploads)
          case $$code in 200|409) echo "bucket ready ($$code)"; exit 0 ;; esac
          sleep 1
        done
        echo "could not create the bucket (last status $$code)"; exit 1

  sftp:
    image: ${SFTP_S3_IMAGE:-ghcr.io/solcreek/sftp-s3:0.2}
    depends_on:
      create-bucket:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:2222:2222"
    environment:
      S3_BUCKET: uploads
      S3_ENDPOINT: http://s3:9000
      AWS_ACCESS_KEY_ID: demo-access-key
      AWS_SECRET_ACCESS_KEY: demo-secret-key
      SFTP_USERS_FILE: /config/users
      SFTP_HOST_KEY_FILE: /config/host_key
    volumes:
      - ./users:/config/users:ro
      - ./host_key:/config/host_key:ro

volumes:
  s3-data:
