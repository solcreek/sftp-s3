apiVersion: v1
kind: Service
metadata:
  name: sftp-s3
  # Cloud-specific annotations go here, e.g. for an AWS NLB:
  # annotations:
  #   service.beta.kubernetes.io/aws-load-balancer-type: external
  #   service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
  #   service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
  #   # With ip targets the NLB checks pods itself; /healthz on the pod's
  #   # http port makes it stop sending clients to a draining pod:
  #   service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: http
  #   service.beta.kubernetes.io/aws-load-balancer-healthcheck-port: "9090"
  #   service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: /healthz
spec:
  type: LoadBalancer
  # Keep client IPs in the logs; also what loadBalancerSourceRanges needs.
  externalTrafficPolicy: Local
  # loadBalancerSourceRanges: ["203.0.113.0/24"]
  selector: {}
  ports:
    - name: sftp
      port: 22
      targetPort: sftp
