apiVersion: apps/v1
kind: Deployment
metadata:
  name: sftp-s3
spec:
  replicas: 2
  selector:
    matchLabels: {}
  template:
    metadata:
      # For a Prometheus that discovers pods by annotation. /metrics has no
      # authentication: the port is reachable inside the cluster only (the
      # Service does not expose it); add a NetworkPolicy to narrow that.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: sftp-s3
      # On SIGTERM the server stops accepting and waits for open sessions;
      # this is how long uploads in flight get during a rollout.
      terminationGracePeriodSeconds: 300
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sftp-s3
      containers:
        - name: sftp-s3
          image: ghcr.io/solcreek/sftp-s3
          ports:
            - name: sftp
              containerPort: 2222
            # /healthz and /metrics; not in service.yaml, so not public.
            - name: http
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: sftp-s3
            # Static S3 credentials, if you do not use workload identity
            # (see serviceaccount.yaml):
            # - secretRef:
            #     name: sftp-s3-aws   # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
          env:
            - name: PORT
              value: "2222"
            - name: SFTP_USERS_FILE
              value: /config/users
            - name: SFTP_HOST_KEY_FILE
              value: /config/host_key
            - name: SFTP_METRICS_ADDR
              value: ":9090"
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          # Ready means accepting SFTP connections: /healthz turns 503 as
          # soon as SIGTERM arrives, while open sessions drain. It does not
          # call S3, so a store outage does not empty the Service.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 1
          # Liveness stays a TCP check on the SFTP port: it must keep passing
          # during the drain, or the kubelet would kill uploads in flight.
          livenessProbe:
            tcpSocket:
              port: sftp
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: config
          secret:
            secretName: sftp-s3
            defaultMode: 0440
