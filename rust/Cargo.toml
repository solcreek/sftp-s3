[package]
name = "sftp-s3-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
aws-config = "1.13.0"
aws-sdk-s3 = "1.157.0"
rand = "0.10.3"
russh = "0.65.0"
russh-sftp = "3.0.1"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
strip = true
lto = "thin"
