# Fly.io: one of the few "push a container" platforms that accepts raw TCP.
# Deploy:  fly launch --no-deploy
#   fly secrets set S3_BUCKET=... AWS_ACCESS_KEY_ID=... AWS_SECRET_ACCESS_KEY=... AWS_REGION=... \
#                   SFTP_USERS='alice:...' SFTP_HOST_KEY="$(cat host_ed25519)"
#   fly ips allocate-v4      # dedicated IPv4: raw TCP on port 22 needs one
app = "sftp-s3"  # must be unique on Fly.io; change it
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[[services]]
  internal_port = 2222
  protocol = "tcp"
  auto_stop_machines = "off"   # an SFTP client won't wait for a cold start
  min_machines_running = 1
  [[services.ports]]
    port = 22
  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
