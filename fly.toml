# Fly.io runs raw TCP services, so it can host the gateway on port 22.
# Not verified for this release; please report how it goes.
#
#   fly launch --no-deploy --copy-config      # pick a unique app name
#   fly secrets set S3_BUCKET=... AWS_REGION=... AWS_ACCESS_KEY_ID=... AWS_SECRET_ACCESS_KEY=... \
#                   SFTP_USERS="$(cat users)" SFTP_HOST_KEY="$(cat host_ed25519)"
#   fly ips allocate-v4                       # a dedicated IPv4: port 22 needs one
#   fly deploy
app = "sftp-s3"
primary_region = "nrt"

[build]
  image = "ghcr.io/solcreek/sftp-s3:0.1"

[[services]]
  internal_port = 2222
  protocol = "tcp"
  auto_stop_machines = "off"   # an SFTP client won't wait for a cold start
  min_machines_running = 1
  [[services.ports]]
    port = 22
  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
