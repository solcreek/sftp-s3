# Push a tag like v0.1.0 (or v0.1.0-rc.1 for a pre-release) to publish
# binaries, checksums, SBOMs and the ghcr.io image, signed with cosign.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write  # create the GitHub release
  packages: write  # push to ghcr.io
  id-token: write  # keyless cosign signing
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make cover
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Check what was published, as a user would: signatures, and the image
  # running on both architectures.
  verify:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IDENTITY: ^https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/
      ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: sigstore/cosign-installer@v3
      - uses: docker/setup-qemu-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Checksums signature
        run: |
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -p 'checksums.txt*'
          cosign verify-blob --bundle checksums.txt.sigstore.json \
            --certificate-identity-regexp "$IDENTITY" --certificate-oidc-issuer "$ISSUER" checksums.txt
      - name: Image signature and both architectures
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME#v}"
          cosign verify --certificate-identity-regexp "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$image" >/dev/null
          for platform in linux/amd64 linux/arm64; do
            out=$(docker run --rm --platform "$platform" "$image" -version)
            echo "$platform: $out"
            [ "$out" = "sftp-s3 ${GITHUB_REF_NAME#v}" ]
          done
